# Render Blueprint — Solar System 3D Tour
# Services: Express web, FastAPI ML, Telegram bot worker
version: "1"
projects:
- name: My project
  env: python
  environments:
  - name: Production
    services:
    # ── Express web (port 5000) ───────────────────────────────────
    - type: web
      name: solar-system-api
      runtime: node
      repo: https://github.com/vodkashot-star/solar-system
      plan: free
      envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SPACEAI_URL
        sync: false
      region: oregon
      buildCommand: npm install --include=dev && npm run build
      startCommand: node dist/index-prod.js
      healthCheckPath: /api/health
      autoDeployTrigger: commit
    # ── FastAPI ML (port 8000) ───────────────────────────────────
    - type: web
      name: solar-system-ml
      runtime: python
      repo: https://github.com/vodkashot-star/solar-system
      plan: free
      region: oregon
      buildCommand: cd spaceAI && python -m venv venv && ./venv/bin/pip install -r
        requirements.txt
      startCommand: cd spaceAI && ./venv/bin/python run.py serve
      healthCheckPath: /
      autoDeployTrigger: commit
      envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    # ── Telegram bot worker (background) ──────────────────────────
    - type: worker
      name: solar-system-bot
      runtime: python
      repo: https://github.com/vodkashot-star/solar-system
      plan: free
      region: oregon
      buildCommand: cd spaceAI && python -m venv venv && ./venv/bin/pip install -r
        requirements.txt
      startCommand: cd spaceAI && ./venv/bin/python telegram_bot.py
      autoDeployTrigger: commit
      envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
